openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bot
    description: Kron trading bot controls and monitoring
paths:
  /kron/testnet/inspect:
    get:
      operationId: inspectTestnetToken
      tags: [health]
      summary: Read-only testnet KCC-20 token preflight
      parameters:
        - in: query
          name: address
          required: true
          schema:
            type: string
        - in: query
          name: ticker
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verified public testnet token holdings and template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestnetTokenInspection"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bot/state:
    get:
      operationId: getBotState
      tags: [bot]
      summary: Get current bot state
      responses:
        "200":
          description: Current bot state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotState"
  /bot/config:
    patch:
      operationId: updateBotConfig
      tags: [bot]
      summary: Update bot strategy configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotConfigInput"
      responses:
        "200":
          description: Updated bot state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotState"
        "400":
          description: Invalid configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bot/start:
    post:
      operationId: startBot
      tags: [bot]
      summary: Start the configured bot
      responses:
        "200":
          description: Started bot state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotState"
  /bot/stop:
    post:
      operationId: stopBot
      tags: [bot]
      summary: Stop the bot and cancel future scheduled orders
      responses:
        "200":
          description: Stopped bot state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotState"
  /bot/run-once:
    post:
      operationId: runBotOnce
      tags: [bot]
      summary: Run the next strategy step in dry-run mode
      responses:
        "200":
          description: Result of the simulated strategy step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotRunResult"
  /bot/activity:
    get:
      operationId: getBotActivity
      tags: [bot]
      summary: Get recent bot activity
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
      responses:
        "200":
          description: Recent activity entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEntry"
  /bot/market:
    get:
      operationId: getMarketSnapshot
      tags: [bot]
      summary: Get the latest configured market snapshot
      responses:
        "200":
          description: Market snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSnapshot"
  /bot/simulate:
    post:
      operationId: simulateBotRun
      tags: [bot]
      summary: Simulate the configured strategy over a long time horizon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationInput"
      responses:
        "200":
          description: Long-run simulation results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResult"
  /bot/live-buy/prepare:
    post:
      operationId: prepareLiveBuy
      tags: [bot]
      summary: Build a read-only preview of one capped live buy
      responses:
        "200":
          description: Current live buy preview; no transaction is signed or submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveBuyPreview"
        "400":
          description: Live buy cannot be prepared safely
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /app/auth/challenge:
    post:
      operationId: createWalletChallenge
      tags: [bot]
      summary: Create a single-use wallet ownership challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletChallengeInput"
      responses:
        "200":
          description: Wallet challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletChallenge"
  /app/auth/verify:
    post:
      operationId: verifyWalletChallenge
      tags: [bot]
      summary: Verify wallet ownership and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletVerificationInput"
      responses:
        "200":
          description: Authenticated app state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBotDashboard"
  /app/auth/logout:
    post:
      operationId: logoutWallet
      tags: [bot]
      summary: End the wallet session
      responses:
        "204":
          description: Session ended
  /app/dashboard:
    get:
      operationId: getUserBotDashboard
      tags: [bot]
      summary: Get the authenticated user's bot dashboard
      responses:
        "200":
          description: User bot dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBotDashboard"
  /app/bot/setup:
    post:
      operationId: setupUserBot
      tags: [bot]
      summary: Validate a KCC20 token and create an isolated bot wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotSetupInput"
      responses:
        "200":
          description: Updated user bot dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBotDashboard"
  /app/bot/activation/verify:
    post:
      operationId: verifyBotActivation
      tags: [bot]
      summary: Verify the 100 KAS activation payment on-chain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivationVerificationInput"
      responses:
        "200":
          description: Updated user bot dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBotDashboard"
  /app/bot/covenant/change:
    post:
      operationId: changeUserBotCovenant
      tags: [bot]
      summary: Change the covenant after all positions are sold and require a new activation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CovenantChangeInput"
      responses:
        "200":
          description: Updated user bot dashboard awaiting activation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBotDashboard"
  /app/bot/start:
    post:
      operationId: startUserBot
      tags: [bot]
      summary: Start the fixed-strategy user bot
      responses:
        "200":
          description: Updated user bot dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBotDashboard"
  /app/bot/stop:
    post:
      operationId: stopUserBot
      tags: [bot]
      summary: Stop the authenticated user's bot
      responses:
        "200":
          description: Updated user bot dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBotDashboard"
  /app/bot/withdraw:
    post:
      operationId: prepareUserBotKasWithdrawal
      tags: [bot]
      summary: Prepare a bot-wallet withdrawal for connected-wallet fee signing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KasWithdrawalInput"
      responses:
        "200":
          description: Withdrawal transaction awaiting the connected wallet signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KasWithdrawalPreparation"
  /app/bot/withdraw/submit:
    post:
      operationId: submitUserBotKasWithdrawal
      tags: [bot]
      summary: Validate and submit a connected-wallet-signed withdrawal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KasWithdrawalSubmission"
      responses:
        "200":
          description: Submitted KAS withdrawal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KasWithdrawalResult"
components:
  schemas:
    TestnetTokenInspection:
      type: object
      properties:
        network: { type: string }
        ticker: { type: string }
        tokenCovenantId: { type: string }
        tokenDecimals: { type: number }
        utxoCount: { type: number }
        balanceUnits: { type: string }
        ownerMode: { type: number }
        tokenCarrierSompi: { type: string }
        stateStart: { type: number }
        stateLength: { type: number }
        templatePrefixLength: { type: number }
        templateSuffixLength: { type: number }
        tokenTemplateHash: { type: string }
      required:
        - network
        - ticker
        - tokenCovenantId
        - tokenDecimals
        - utxoCount
        - balanceUnits
        - ownerMode
        - tokenCarrierSompi
        - stateStart
        - stateLength
        - templatePrefixLength
        - templateSuffixLength
        - tokenTemplateHash
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BotConfigInput:
      type: object
      properties:
        tokenId:
          type: string
          minLength: 1
        buyCount:
          type: integer
          minimum: 1
          maximum: 100
        sellCount:
          type: integer
          minimum: 1
          maximum: 100
        tradesPerHour:
          type: integer
          minimum: 1
          maximum: 120
        orderSizeKas:
          type: number
          minimum: 0.000001
        maxSlippagePercent:
          type: number
          minimum: 0.01
          maximum: 50
        maxDailyLossKas:
          type: number
          minimum: 0
        minKasReserve:
          type: number
          minimum: 0
        mode:
          type: string
          enum: [dry-run, live]
        timeZone:
          type: string
          minLength: 1
      required:
        - tokenId
        - buyCount
        - sellCount
        - tradesPerHour
        - orderSizeKas
        - maxSlippagePercent
        - maxDailyLossKas
        - minKasReserve
        - mode
        - timeZone
    BotConfig:
      allOf:
        - $ref: "#/components/schemas/BotConfigInput"
    BotState:
      type: object
      required:
        - status
        - mode
        - phase
        - completedBuys
        - completedSells
        - totalTradesToday
        - hourlyTradeCount
        - hourlyTradeLimit
        - nextRunAt
        - lastRunAt
        - config
        - wallet
        - safety
      properties:
        status:
          type: string
          enum: [stopped, running, paused]
        mode:
          type: string
          enum: [dry-run, live]
        phase:
          type: string
          enum: [buying, selling]
        completedBuys:
          type: integer
        completedSells:
          type: integer
        totalTradesToday:
          type: integer
        hourlyTradeCount:
          type: integer
        hourlyTradeLimit:
          type: integer
        nextRunAt:
          type: ["string", "null"]
          format: date-time
        lastRunAt:
          type: ["string", "null"]
          format: date-time
        config:
          $ref: "#/components/schemas/BotConfig"
        wallet:
          $ref: "#/components/schemas/WalletStatus"
        safety:
          $ref: "#/components/schemas/SafetyStatus"
    WalletStatus:
      type: object
      required: [connected, address, kasBalance, tokenBalance]
      properties:
        connected:
          type: boolean
        address:
          type: string
        kasBalance:
          type: number
        tokenBalance:
          type: number
    SafetyStatus:
      type: object
      required: [canTrade, reason, killSwitchArmed, dailyLossKas]
      properties:
        canTrade:
          type: boolean
        reason:
          type: string
        killSwitchArmed:
          type: boolean
        dailyLossKas:
          type: number
    BotRunResult:
      type: object
      required: [action, status, message, state, activity]
      properties:
        action:
          type: string
          enum: [buy, sell, none]
        status:
          type: string
          enum: [simulated, blocked, completed]
        message:
          type: string
        state:
          $ref: "#/components/schemas/BotState"
        activity:
          $ref: "#/components/schemas/ActivityEntry"
    ActivityEntry:
      type: object
      required: [id, timestamp, action, status, detail, amountKas]
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        action:
          type: string
          enum: [buy, sell, system, safety]
        status:
          type: string
          enum: [simulated, completed, blocked, info]
        detail:
          type: string
        amountKas:
          type: number
    MarketSnapshot:
      type: object
      required: [tokenId, symbol, priceKas, priceUsd, liquidityKas, change24hPercent, updatedAt]
      properties:
        tokenId:
          type: string
        symbol:
          type: string
        priceKas:
          type: number
        priceUsd:
          type: number
        liquidityKas:
          type: number
        change24hPercent:
          type: number
        updatedAt:
          type: string
          format: date-time
    SimulationInput:
      type: object
      required: [startingKas, hours, tradeFeePercent]
      properties:
        startingKas:
          type: number
          minimum: 0
        hours:
          type: integer
          minimum: 1
          maximum: 100000
        tradeFeePercent:
          type: number
          minimum: 0
          maximum: 100
    SimulationResult:
      type: object
      required:
        - startingKas
        - endingKas
        - endingPortfolioKas
        - netChangeKas
        - hoursRequested
        - hoursCompleted
        - tradesCompleted
        - buysCompleted
        - sellsCompleted
        - completedCycles
        - tradeFeesPaidKas
        - buyNotionalKas
        - sellProceedsKas
        - endingTokenUnits
        - stoppedReason
        - assumptions
      properties:
        startingKas:
          type: number
        endingKas:
          type: number
        endingPortfolioKas:
          type: number
        netChangeKas:
          type: number
        hoursRequested:
          type: integer
        hoursCompleted:
          type: number
        tradesCompleted:
          type: integer
        buysCompleted:
          type: integer
        sellsCompleted:
          type: integer
        completedCycles:
          type: integer
        tradeFeesPaidKas:
          type: number
        buyNotionalKas:
          type: number
        sellProceedsKas:
          type: number
        endingTokenUnits:
          type: number
        stoppedReason:
          type: string
          enum: [hours-completed, insufficient-kas, no-token-inventory]
        assumptions:
          type: array
          items:
            type: string
    LiveBuyPreview:
      type: object
      required:
        - tokenId
        - symbol
        - tokenName
        - walletAddress
        - walletKasBalance
        - walletTokenBalance
        - tradeKas
        - tokenOut
        - kronFeeKas
        - networkFeeKas
        - recipientDustKas
        - maximumDebitKas
        - transactionBuilt
        - signed
        - submitted
        - preparedAt
        - warnings
      properties:
        tokenId:
          type: string
        symbol:
          type: string
        tokenName:
          type: string
        walletAddress:
          type: string
        walletKasBalance:
          type: number
        walletTokenBalance:
          type: number
        tradeKas:
          type: number
        tokenOut:
          type: number
        kronFeeKas:
          type: number
        networkFeeKas:
          type: number
        recipientDustKas:
          type: number
        maximumDebitKas:
          type: number
        transactionBuilt:
          type: boolean
        signed:
          type: boolean
        submitted:
          type: boolean
        preparedAt:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    WalletChallengeInput:
      type: object
      required: [walletAddress, publicKey]
      properties:
        walletAddress:
          type: string
          minLength: 20
        publicKey:
          type: string
          minLength: 64
    WalletChallenge:
      type: object
      required: [challengeId, message, expiresAt]
      properties:
        challengeId:
          type: string
        message:
          type: string
        expiresAt:
          type: string
          format: date-time
    WalletVerificationInput:
      allOf:
        - $ref: "#/components/schemas/WalletChallengeInput"
        - type: object
          required: [challengeId, signature]
          properties:
            challengeId:
              type: string
            signature:
              type: string
              minLength: 64
    BotSetupInput:
      type: object
      required: [tokenId]
      properties:
        tokenId:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
    CovenantChangeInput:
      type: object
      required: [tokenId]
      properties:
        tokenId:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
    KasWithdrawalInput:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [amount, max]
        amountKas:
          type: string
          pattern: "^(?:0|[1-9][0-9]*)(?:\\.[0-9]{1,8})?$"
    KasWithdrawalPreparation:
      type: object
      required: [txJsonString, signInputs, destinationAddress, amountKas, feeKas, remainingBalanceKas]
      properties:
        txJsonString:
          type: string
        signInputs:
          type: array
          items:
            type: object
            required: [index, sighashType]
            properties:
              index:
                type: integer
              sighashType:
                type: integer
        destinationAddress:
          type: string
        amountKas:
          type: string
        feeKas:
          type: string
        remainingBalanceKas:
          type: string
    KasWithdrawalSubmission:
      type: object
      required: [signedTransaction]
      properties:
        signedTransaction:
          type: string
    KasWithdrawalResult:
      type: object
      required: [transactionId, destinationAddress, amountKas, feeKas, remainingBalanceKas]
      properties:
        transactionId:
          type: string
        destinationAddress:
          type: string
        amountKas:
          type: string
        feeKas:
          type: string
        remainingBalanceKas:
          type: string
    ActivationVerificationInput:
      type: object
      required: [transactionId]
      properties:
        transactionId:
          type: string
          pattern: "^[a-fA-F0-9]{64}$"
    FixedStrategy:
      type: object
      required: [orderSizeKas, buyCount, sellCount, tradesPerHour, activationFeeKas, activationAddress]
      properties:
        orderSizeKas:
          type: number
        buyCount:
          type: integer
        sellCount:
          type: integer
        tradesPerHour:
          type: integer
        activationFeeKas:
          type: number
        activationAddress:
          type: string
    UserBotDashboard:
      type: object
      required: [authenticated, walletAddress, strategy, bot]
      properties:
        authenticated:
          type: boolean
        walletAddress:
          type: string
        strategy:
          $ref: "#/components/schemas/FixedStrategy"
        bot:
          type: ["object", "null"]
          properties:
            id:
              type: string
            botAddress:
              type: string
            tokenId:
              type: ["string", "null"]
            tokenSymbol:
              type: ["string", "null"]
            configurationVersion:
              type: integer
            activationPaid:
              type: boolean
            activationTxId:
              type: ["string", "null"]
            status:
              type: string
              enum: [setup, ready, running, paused, stopped]
            phase:
              type: string
              enum: [buying, selling]
            completedBuys:
              type: integer
            completedSells:
              type: integer
            totalTrades:
              type: integer
            nextRunAt:
              type: ["string", "null"]
              format: date-time
            lastTradeAt:
              type: ["string", "null"]
              format: date-time
            stopReason:
              type: ["string", "null"]
            managedTokenAmount:
              type: string
            botKasBalance:
              type: number
            tradeHistory:
              type: array
              items:
                type: object
                properties:
                  action:
                    type: string
                    enum: [buy, sell]
                  transactionId:
                    type: string
                  executedAt:
                    type: string
                    format: date-time
                  tokenAmount:
                    type: string
                  tokenId:
                    type: ["string", "null"]
                  tokenSymbol:
                    type: ["string", "null"]
                required: [action, transactionId, executedAt, tokenAmount, tokenId, tokenSymbol]
          required: [id, botAddress, tokenId, tokenSymbol, configurationVersion, activationPaid, activationTxId, status, phase, completedBuys, completedSells, totalTrades, nextRunAt, lastTradeAt, stopReason, managedTokenAmount, botKasBalance, tradeHistory]

